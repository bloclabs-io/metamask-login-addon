name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Lint
        run: find . -name '*.php' -not -path './vendor/*' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 php -l
      - name: Install
        run: composer install --no-interaction --no-progress
      - name: Unit tests
        run: vendor/bin/phpunit

  js:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          node --check assets/js/metamask-login.js
          node --check assets/js/metamask-login-admin.js
          node --check blocks/login-button/index.js
